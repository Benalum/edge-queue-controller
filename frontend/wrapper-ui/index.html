<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AlexHartel AI Platform</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand logo-only" href="/" data-route="/" aria-label="AlexHartel AI Platform home">
      <span class="brand-mark helper-logo" title="Study Companion Helper">
        <svg viewBox="0 0 64 64" role="img" aria-label="Study Companion Helper logo">
          <path d="M12 16c8 0 14 2 20 7v31c-6-5-12-7-20-7V16z"></path>
          <path d="M52 16c-8 0-14 2-20 7v31c6-5 12-7 20-7V16z"></path>
          <path d="M21 25h8M21 33h8M35 25h8M35 33h8"></path>
          <circle cx="32" cy="12" r="5"></circle>
        </svg>
      </span>
    </a>

    <nav class="nav" aria-label="Main navigation">
      <a href="/study" data-route="/study">Study</a>
      <a href="/companion" data-route="/companion">Companion</a>
      <a href="/profile" data-route="/profile">Profile</a>
      <a href="/support" data-route="/support">Support</a>
      <a id="adminNavLink" class="hidden" href="/admin" data-route="/admin">Admin</a>
      <a href="/system" data-route="/system" id="systemNavLink">
        <span id="systemNavDot" class="dot unknown"></span>
        <span id="systemNavText">System</span>
      </a>

      <button id="creditsPill" class="credits-pill hidden" type="button" data-route="/credits" title="View credits and plans">
        Credits: —
      </button>

      <button id="authOpenBtn" class="primary-btn nav-auth-btn" type="button">
        Login / Register
      </button>

      <button id="logoutBtn" class="ghost-btn nav-auth-btn hidden" type="button">
        Logout
      </button>
    </nav>
  </header>

  <main id="app" class="app-shell">
    Loading...
  </main>

  <aside id="systemDrawer" class="system-drawer hidden" aria-label="System status drawer">
    <div class="drawer-head">
      <div>
        <h2>System Status</h2>
        <p id="drawerSummary">Checking system...</p>
      </div>

      <button id="drawerCloseBtn" class="ghost-btn" type="button">
        Close
      </button>
    </div>

    <div class="status-grid">
      <section>
        <h3>Infrastructure</h3>
        <div id="drawerNodes" class="status-list"></div>
      </section>

      <section>
        <h3>APIs</h3>
        <div id="drawerServices" class="status-list"></div>
      </section>
    </div>
  </aside>

  <section id="authModal" class="auth-modal hidden" aria-label="Login and register dialog">
    <div class="auth-card">
      <div class="drawer-head">
        <div>
          <h2 id="authTitle">Login</h2>
          <p id="authSubtitle">Sign in to access your dashboard and future live services.</p>
        </div>

        <button id="authCloseBtn" class="ghost-btn" type="button">
          Close
        </button>
      </div>

      <div class="auth-tabs">
        <button id="loginTabBtn" class="ghost-btn active" type="button">Login</button>
        <button id="registerTabBtn" class="ghost-btn" type="button">Register</button>
      </div>

      <form id="authForm" class="auth-form">
        <label>
          Email
          <input id="authEmail" type="email" autocomplete="email" required />
        </label>

        <label>
          Password
          <input id="authPassword" type="password" autocomplete="current-password" required />
        </label>

        <button id="authSubmitBtn" class="primary-btn" type="submit">
          Login
        </button>
      </form>

      <div id="authMessage" class="notice hidden"></div>
    </div>
  </section>

  <script src="/app.js?v=20260605145139"></script>
</body>
</html>
