<body>
  <!-- APC_HEADER_COMPONENT_MOUNT -->
  <div id="apcHeaderMount" data-apc-header-mount="true"></div>
  <script src="/header/header.js?v=spa-active-tabs-20260626"></script>
  <!-- /APC_HEADER_COMPONENT_MOUNT -->
  <main id="app" class="app-shell">
  <p>loading..</p>
  </main>
  <aside id="systemDrawer" class="system-drawer hidden" aria-label="System status drawer">
    <div class="drawer-head">
      <div>
        <h2>System Status</h2>
        <p id="drawerSummary">Checking system...</p>
      </div>

      <button id="drawerCloseBtn" class="ghost-btn" type="button">
        Close
      </button>
    </div>

    <div class="status-grid">
      <section>
        <h3>Infrastructure</h3>
        <div id="drawerNodes" class="status-list"></div>
      </section>

      <section>
        <h3>APIs</h3>
        <div id="drawerServices" class="status-list"></div>
      </section>
    </div>
  </aside>

  <section id="authModal" class="auth-modal hidden" aria-label="Login and register dialog">
    <div class="auth-card">
      <div class="drawer-head">
        <div>
          <h2 id="authTitle">Login</h2>
          <p id="authSubtitle">Sign in to access your dashboard and future live services.</p>
        </div>

        <button id="authCloseBtn" class="ghost-btn" type="button">
          Close
        </button>
      </div>

      <div class="auth-tabs">
        <button id="loginTabBtn" class="ghost-btn active" type="button">Login</button>
        <button id="registerTabBtn" class="ghost-btn" type="button">Register</button>
      </div>

      <form id="authForm" class="auth-form">
        <label>
          Email
          <input id="authEmail" type="email" autocomplete="email" required />
        </label>

        <label>
          Password
          <input id="authPassword" type="password" autocomplete="current-password" required />
        </label>

        <button id="authSubmitBtn" class="primary-btn" type="submit">
          Login
        </button>
      </form>

      <div id="authMessage" class="notice hidden"></div>
    </div>
  </section>

  <script src="/queued_chat_config.js"></script>
  <script src="/router_shadow_read_stub.js?v=2026061208k"></script>
  <script src="/auth/auth.js?v=force-hard-logout-reload-20260626"></script>

  <script src="/privatepages/companion.js?v=browser-only-notice-r3m-20260627"></script>

<script>
(function loadQueuedChatStatusAfterInitialPageLoad() {
  const scriptId = "stage10hDeferredQueuedChatStatusScript";
  const scriptSrc = "/queued_chat_status.js";

  function injectQueuedChatStatusScript() {
    if (document.getElementById(scriptId)) return;
    const script = document.createElement("script");
    script.id = scriptId;
    script.src = scriptSrc;
    script.dataset.stage10hDeferredQueuedStatus = "true";
    document.head.appendChild(script);
  }

  if (document.readyState === "complete") {
    window.setTimeout(injectQueuedChatStatusScript, 0);
  } else {
    window.addEventListener("load", function onStage10hWindowLoad() {
      window.setTimeout(injectQueuedChatStatusScript, 0);
    }, { once: true });
  }
})();
</script>
</body>
</html>
