<section class="private-hero">
  <p class="private-eyebrow">Private profile</p>
  <h1>Your profile</h1>
  <p>Account information for {{email}}.</p>
</section>

<section class="private-grid">
  <article class="private-card">
    <h2>Account</h2>
    <p><strong>Email:</strong> {{email}}</p>
    <p><strong>Role:</strong> {{role}}</p>
    <p><strong>Plan:</strong> {{plan}}</p>
    <p><strong>Status:</strong> {{status}}</p>
  </article>

  <article class="private-card">
    <h2>Password</h2>
    <p>Password reset is now connected through Resend SMTP.</p>
    <div class="private-actions">
      <button class="private-button" type="button" data-private-open-recover>Send reset email</button>
    </div>
  </article>

  <article class="private-card">
    <h2>Preferences</h2>
    <p>Future profile preferences will live here.</p>
  </article>
</section>
