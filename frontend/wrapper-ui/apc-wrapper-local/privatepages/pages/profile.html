<section class="private-profile-root profile-page" data-apc-profile-root data-page="profile" data-route="profile">
  <section class="private-hero">
    <h1>Your profile</h1>
    <p>Account information for {{email}}.</p>
  </section>

  <section class="private-grid profile-grid" data-apc-profile-grid>
    <article class="private-card" data-apc-profile-account-card>
      <h2>Account</h2>
      <p><strong>Email:</strong> {{email}}</p>
      <p><strong>Role:</strong> {{role}}</p>
      <p><strong>Plan:</strong> {{plan}}</p>
      <p><strong>Status:</strong> {{status}}</p>
    </article>

    <div data-apc-profile-google-sync-host></div>
    <div data-apc-profile-anki-manifest-host></div>
    <div data-apc-profile-anki-preview-host></div>
  </section>
</section>
