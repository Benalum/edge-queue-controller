# Stage 16 E3Z CT101 Ollama model profiles.
#
# Repo-only artifact. These profiles are intentionally disabled by default.
# They are not activated by this file being present in the repository.
# Runtime use requires a later explicit apply/activation boundary.
#
# Safety contract:
# - CT203 claim policy remains one_at_a_time.
# - Do not assume max_jobs > 1 is honored by CT203 claim endpoint.
# - Do not start or unmask CT101 persistent worker service from this artifact.
# - Do not activate scheduler or timer from this artifact.
# - Do not expose model endpoints directly to public users.

schema_version: 1
artifact_id: ct101_ollama_model_profiles_stage16_e3z
runtime_owner: ct101
model_runtime: ollama_docker_container
container_name: ollama
